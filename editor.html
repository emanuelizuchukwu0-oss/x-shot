<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>Rendar — Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; background: #0a0a0c; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #f5f5f7; }

  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr;
    height: 100%;
  }

  /* Top bar */
  .topbar {
    background: #141416;
    border-bottom: 1px solid #23232a;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }
  .topbar .left, .topbar .right {
    display: flex; align-items: center; gap: 8px;
  }
  .brand-mini {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 14px;
    margin-right: 12px;
  }
  .brand-mini .mark {
    width: 22px; height: 22px; border-radius: 5px;
    background: linear-gradient(135deg, #00d4ff, #a78bfa);
    color: #000; font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .tb-btn {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: #f5f5f7;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    display: flex; align-items: center; gap: 6px;
  }
  .tb-btn:hover { background: rgba(255,255,255,.1); }
  .tb-btn.primary {
    background: #00d4ff; color: #000; border-color: #00d4ff;
  }
  .tb-btn.primary:hover { background: #22ddff; }
  .tb-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Main 3-column layout */
  .main {
    display: grid;
    grid-template-columns: 240px 1fr 260px;
    overflow: hidden;
    min-height: 0;
  }
  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; position: relative; }
  }

  /* Left panel — tools */
  .panel {
    background: #141416;
    border-right: 1px solid #23232a;
    overflow-y: auto;
    padding: 12px;
  }
  .panel.right { border-right: none; border-left: 1px solid #23232a; }

  @media (max-width: 900px) {
    .panel {
      position: absolute; top: 0; bottom: 0;
      width: 240px;
      transform: translateX(-100%);
      transition: transform .25s;
      z-index: 20;
    }
    .panel.right { right: 0; left: auto; transform: translateX(100%); }
    .panel.open { transform: translateX(0); }
  }

  .panel-title {
    font-size: 10px; font-weight: 800;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #6a6a72;
    margin: 8px 4px 10px;
  }

  /* Tool buttons */
  .tool-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tool-btn {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.06);
    color: #c5c5cc;
    padding: 12px 8px;
    border-radius: 10px;
    font-size: 11px; font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: all .15s;
    font-family: inherit;
  }
  .tool-btn .ico { font-size: 18px; line-height: 1; }
  .tool-btn:hover { background: rgba(255,255,255,.08); }
  .tool-btn.active {
    background: rgba(0,212,255,.15);
    border-color: #00d4ff;
    color: #00d4ff;
  }

  /* Right panel — adjustments */
  .adj-group { margin-bottom: 20px; }
  .adj-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 700;
    color: #a5a5ad;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .adj-label .val {
    color: #00d4ff; font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  .adj-slider {
    width: 100%;
    -webkit-appearance: none;
    height: 3px;
    background: rgba(255,255,255,.1);
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }
  .adj-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #00d4ff;
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(0,212,255,.2);
  }
  .adj-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #00d4ff; border: none; cursor: pointer;
  }

  /* Filters */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .filter-btn {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.06);
    color: #c5c5cc;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 10px; font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    text-align: center;
    font-family: inherit;
  }
  .filter-btn.active {
    background: rgba(0,212,255,.15);
    border-color: #00d4ff;
    color: #00d4ff;
  }

  /* Canvas area */
  .canvas-area {
    position: relative;
    background:
      linear-gradient(45deg, #1a1a1d 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a1d 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a1d 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a1d 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, 10px 0px;
    background-color: #0f0f11;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  #canvas {
    max-width: 95%;
    max-height: 95%;
    box-shadow: 0 10px 60px rgba(0,0,0,.6);
    touch-action: none;
    cursor: default;
  }
  .canvas-hint {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.7);
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    backdrop-filter: blur(10px);
    display: none;
  }

  /* Text overlay layer */
  .text-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .text-item {
    position: absolute;
    pointer-events: auto;
    padding: 4px 8px;
    border: 1.5px dashed transparent;
    cursor: move;
    white-space: pre;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    touch-action: none;
  }
  .text-item.selected {
    border-color: #00d4ff;
    background: rgba(0,212,255,.08);
  }
  .text-item.editing {
    border-color: #a78bfa;
    background: rgba(167,139,250,.08);
  }
  .text-item input {
    background: transparent;
    border: none; outline: none;
    color: inherit;
    font: inherit;
    padding: 0;
    width: 100%;
    min-width: 40px;
  }

  /* Mobile bottom toolbar */
  .mobile-bar {
    display: none;
    background: #141416;
    border-top: 1px solid #23232a;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    gap: 8px;
    justify-content: center;
  }
  @media (max-width: 900px) {
    .mobile-bar { display: flex; }
  }
  .mb-btn {
    flex: 1;
    max-width: 120px;
    padding: 10px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: #f5f5f7;
    border-radius: 10px;
    font-size: 11px; font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  /* Empty state */
  .empty {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0c;
    text-align: center;
    color: #6a6a72;
    padding: 40px;
    font-size: 14px;
    line-height: 1.6;
    z-index: 30;
  }
  .empty a { color: #00d4ff; font-weight: 700; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.9);
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="left">
      <a class="brand-mini" href="/">
        <span class="mark">R</span>
        <span>Rendar</span>
      </a>
      <button class="tb-btn" id="undoBtn" disabled>↶ Undo</button>
      <button class="tb-btn" id="resetBtn">Reset</button>
    </div>
    <div class="right">
      <button class="tb-btn" id="downloadBtn">↓ Download</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Left panel -->
    <aside class="panel left" id="leftPanel">
      <div class="panel-title">Tools</div>
      <div class="tool-grid">
        <button class="tool-btn" data-tool="select"><span class="ico">👆</span>Select</button>
        <button class="tool-btn" data-tool="text"><span class="ico">T</span>Text</button>
        <button class="tool-btn" data-tool="erase"><span class="ico">⌫</span>Erase</button>
        <button class="tool-btn" data-tool="crop"><span class="ico">✂</span>Crop</button>
        <button class="tool-btn" data-tool="rotate"><span class="ico">↻</span>Rotate</button>
        <button class="tool-btn" data-tool="flip"><span class="ico">⇋</span>Flip</button>
      </div>

      <div class="panel-title">Filters</div>
      <div class="filter-grid" id="filterGrid">
        <button class="filter-btn active" data-filter="none">None</button>
        <button class="filter-btn" data-filter="bw">B&W</button>
        <button class="filter-btn" data-filter="sepia">Sepia</button>
        <button class="filter-btn" data-filter="vivid">Vivid</button>
        <button class="filter-btn" data-filter="warm">Warm</button>
        <button class="filter-btn" data-filter="cool">Cool</button>
        <button class="filter-btn" data-filter="fade">Fade</button>
        <button class="filter-btn" data-filter="noir">Noir</button>
        <button class="filter-btn" data-filter="vintage">Vintage</button>
      </div>
    </aside>

    <!-- Canvas -->
    <div class="canvas-area" id="canvasArea">
      <canvas id="canvas"></canvas>
      <div class="text-layer" id="textLayer"></div>
      <div class="canvas-hint" id="canvasHint"></div>
      <div class="empty" id="emptyState" style="display:none;">
        <div>
          <div style="font-size:40px;margin-bottom:12px;">📷</div>
          <div>No image loaded.</div>
          <div style="margin-top:8px;">
            <a href="/">Go to Rendar home</a> to upload one.
          </div>
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <aside class="panel right" id="rightPanel">
      <div class="panel-title">Adjustments</div>

      <div class="adj-group">
        <div class="adj-label">Brightness <span class="val" id="vBrightness">0</span></div>
        <input type="range" class="adj-slider" id="brightness" min="-100" max="100" value="0" />
      </div>

      <div class="adj-group">
        <div class="adj-label">Contrast <span class="val" id="vContrast">0</span></div>
        <input type="range" class="adj-slider" id="contrast" min="-100" max="100" value="0" />
      </div>

      <div class="adj-group">
        <div class="adj-label">Saturation <span class="val" id="vSaturation">0</span></div>
        <input type="range" class="adj-slider" id="saturation" min="-100" max="100" value="0" />
      </div>

      <div class="adj-group">
        <div class="adj-label">Warmth <span class="val" id="vWarmth">0</span></div>
        <input type="range" class="adj-slider" id="warmth" min="-100" max="100" value="0" />
      </div>

      <div class="adj-group">
        <div class="adj-label">Blur <span class="val" id="vBlur">0</span></div>
        <input type="range" class="adj-slider" id="blur" min="0" max="20" value="0" />
      </div>

      <div class="adj-group">
        <div class="adj-label">Vignette <span class="val" id="vVignette">0</span></div>
        <input type="range" class="adj-slider" id="vignette" min="0" max="100" value="0" />
      </div>
    </aside>

  </div>

  <!-- Mobile bottom bar -->
  <div class="mobile-bar">
    <button class="mb-btn" id="openToolsBtn">🛠 Tools</button>
    <button class="mb-btn" id="openAdjBtn">⚙ Adjust</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   RENDAR EDITOR
   ============================================================ */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const canvasArea = document.getElementById('canvasArea');
const textLayer = document.getElementById('textLayer');
const emptyState = document.getElementById('emptyState');
const toast = document.getElementById('toast');
const undoBtn = document.getElementById('undoBtn');

let originalImage = null;      // Image element of the source
let historyStack = [];         // ImageData snapshots
let textItems = [];
let selectedText = null;
let currentTool = 'select';
let currentFilter = 'none';

// Adjustments
let adjustments = {
  brightness: 0,
  contrast: 0,
  saturation: 0,
  warmth: 0,
  blur: 0,
  vignette: 0
};

/* ---------- Show toast ---------- */
function showToast(msg, ms = 1600) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
}

/* ---------- Load image from sessionStorage ---------- */
function loadImage() {
  const url = sessionStorage.getItem('rendar_image');
  if (!url) {
    emptyState.style.display = 'flex';
    return;
  }
  emptyState.style.display = 'none';

  const img = new Image();
  img.onload = () => {
    originalImage = img;

    // Size the canvas to the image
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    fitCanvasToView();
    redraw();
    pushHistory();
  };
  img.onerror = () => {
    emptyState.style.display = 'flex';
  };
  img.src = url;
}

function fitCanvasToView() {
  const areaRect = canvasArea.getBoundingClientRect();
  const ratio = canvas.width / canvas.height;
  let w = areaRect.width * 0.95;
  let h = w / ratio;
  if (h > areaRect.height * 0.95) {
    h = areaRect.height * 0.95;
    w = h * ratio;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}

window.addEventListener('resize', fitCanvasToView);

/* ---------- Redraw everything ---------- */
function redraw() {
  if (!originalImage) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.filter = 'none';
  ctx.drawImage(originalImage, 0, 0);

  // Apply pixel-level adjustments (brightness, contrast, saturation, warmth)
  applyPixelAdjustments();

  // Apply filter
  applyFilterToCanvas();

  // Apply blur (via CSS filter on a copy)
  if (adjustments.blur > 0) {
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width;
    tmp.height = canvas.height;
    tmp.getContext('2d').drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.filter = `blur(${adjustments.blur}px)`;
    ctx.drawImage(tmp, 0, 0);
    ctx.filter = 'none';
  }

  // Apply vignette
  if (adjustments.vignette > 0) {
    applyVignette();
  }
}

function applyPixelAdjustments() {
  const b = adjustments.brightness;
  const c = adjustments.contrast;
  const s = adjustments.saturation;
  const w = adjustments.warmth;
  if (b === 0 && c === 0 && s === 0 && w === 0) return;

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;

  // Precompute contrast factor
  const contrastFactor = (259 * (c + 255)) / (255 * (259 - c));

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], bl = d[i + 2];

    // Brightness
    if (b !== 0) {
      r += b; g += b; bl += b;
    }

    // Contrast
    if (c !== 0) {
      r = contrastFactor * (r - 128) + 128;
      g = contrastFactor * (g - 128) + 128;
      bl = contrastFactor * (bl - 128) + 128;
    }

    // Saturation (grayscale mix)
    if (s !== 0) {
      const lum = 0.299 * r + 0.587 * g + 0.114 * bl;
      const satFactor = 1 + s / 100;
      r = lum + (r - lum) * satFactor;
      g = lum + (g - lum) * satFactor;
      bl = lum + (bl - lum) * satFactor;
    }

    // Warmth (shift R up / B down for warm, reverse for cool)
    if (w !== 0) {
      r += w * 0.3;
      bl -= w * 0.3;
    }

    d[i]     = Math.max(0, Math.min(255, r));
    d[i + 1] = Math.max(0, Math.min(255, g));
    d[i + 2] = Math.max(0, Math.min(255, bl));
  }

  ctx.putImageData(imgData, 0, 0);
}

function applyFilterToCanvas() {
  if (currentFilter === 'none') return;

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];

    switch (currentFilter) {
      case 'bw': {
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        r = g = b = lum;
        break;
      }
      case 'sepia': {
        const nr = 0.393 * r + 0.769 * g + 0.189 * b;
        const ng = 0.349 * r + 0.686 * g + 0.168 * b;
        const nb = 0.272 * r + 0.534 * g + 0.131 * b;
        r = nr; g = ng; b = nb;
        break;
      }
      case 'vivid': {
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        r = lum + (r - lum) * 1.4;
        g = lum + (g - lum) * 1.4;
        b = lum + (b - lum) * 1.4;
        // slight contrast
        r = (r - 128) * 1.1 + 128;
        g = (g - 128) * 1.1 + 128;
        b = (b - 128) * 1.1 + 128;
        break;
      }
      case 'warm': {
        r = Math.min(255, r + 20);
        b = Math.max(0, b - 15);
        break;
      }
      case 'cool': {
        r = Math.max(0, r - 15);
        b = Math.min(255, b + 20);
        break;
      }
      case 'fade': {
        r = r * 0.85 + 40;
        g = g * 0.85 + 40;
        b = b * 0.85 + 40;
        break;
      }
      case 'noir': {
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        r = g = b = lum;
        r = (r - 128) * 1.4 + 128;
        g = (g - 128) * 1.4 + 128;
        b = (b - 128) * 1.4 + 128;
        break;
      }
      case 'vintage': {
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        r = lum * 0.9 + r * 0.1;
        g = lum * 0.85 + g * 0.15;
        b = lum * 0.7 + b * 0.3;
        r = Math.min(255, r + 15);
        g = Math.min(255, g + 10);
        break;
      }
    }

    d[i]     = Math.max(0, Math.min(255, r));
    d[i + 1] = Math.max(0, Math.min(255, g));
    d[i + 2] = Math.max(0, Math.min(255, b));
  }

  ctx.putImageData(imgData, 0, 0);
}

function applyVignette() {
  const strength = adjustments.vignette / 100;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const maxR = Math.hypot(cx, cy);

  const grad = ctx.createRadialGradient(cx, cy, maxR * 0.4, cx, cy, maxR);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${strength * 0.85})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

/* ---------- History (undo) ---------- */
function pushHistory() {
  try {
    const snap = ctx.getImageData(0, 0, canvas.width, canvas.height);
    historyStack.push(snap);
    if (historyStack.length > 15) historyStack.shift();
    undoBtn.disabled = historyStack.length <= 1;
  } catch (e) {
    console.warn('History failed:', e);
  }
}

function undo() {
  if (historyStack.length <= 1) return;
  historyStack.pop();
  const prev = historyStack[historyStack.length - 1];
  ctx.putImageData(prev, 0, 0);
  undoBtn.disabled = historyStack.length <= 1;
}

undoBtn.addEventListener('click', undo);

/* ---------- Reset ---------- */
document.getElementById('resetBtn').addEventListener('click', () => {
  adjustments = { brightness: 0, contrast: 0, saturation: 0, warmth: 0, blur: 0, vignette: 0 };
  currentFilter = 'none';
  document.querySelectorAll('.adj-slider').forEach(s => s.value = 0);
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'none'));
  updateSliderLabels();
  // Clear texts
  textLayer.innerHTML = '';
  textItems = [];
  redraw();
  pushHistory();
  showToast('Reset');
});

/* ---------- Sliders ---------- */
const sliders = {
  brightness: document.getElementById('brightness'),
  contrast: document.getElementById('contrast'),
  saturation: document.getElementById('saturation'),
  warmth: document.getElementById('warmth'),
  blur: document.getElementById('blur'),
  vignette: document.getElementById('vignette')
};

function updateSliderLabels() {
  document.getElementById('vBrightness').textContent = adjustments.brightness;
  document.getElementById('vContrast').textContent = adjustments.contrast;
  document.getElementById('vSaturation').textContent = adjustments.saturation;
  document.getElementById('vWarmth').textContent = adjustments.warmth;
  document.getElementById('vBlur').textContent = adjustments.blur;
  document.getElementById('vVignette').textContent = adjustments.vignette;
}

Object.keys(sliders).forEach(key => {
  let debounceTimer = null;
  sliders[key].addEventListener('input', (e) => {
    adjustments[key] = parseInt(e.target.value, 10);
    updateSliderLabels();
    // Live redraw (debounced for performance)
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(redraw, 30);
  });
  sliders[key].addEventListener('change', () => {
    redraw();
    pushHistory();
  });
});

/* ---------- Filter buttons ---------- */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    redraw();
    pushHistory();
  });
});

/* ---------- Tool buttons ---------- */
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;

    if (tool === 'rotate') {
      rotateCanvas(90);
      return;
    }
    if (tool === 'flip') {
      flipCanvas();
      return;
    }
    if (tool === 'crop') {
      // Simple center crop to 80% for now
      cropCenter(0.8);
      return;
    }

    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = tool;

    if (tool === 'text') {
      showToast('Tap anywhere on the image to add text');
    } else if (tool === 'erase') {
      showToast('Drag on the image to erase');
    }
  });
});

/* ---------- Rotate / Flip / Crop ---------- */
function rotateCanvas(deg) {
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width;
  tmp.height = canvas.height;
  tmp.getContext('2d').drawImage(canvas, 0, 0);

  // Swap dimensions for 90/270
  canvas.width = tmp.height;
  canvas.height = tmp.width;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(tmp, -tmp.width / 2, -tmp.height / 2);
  ctx.restore();

  // Update original reference so subsequent edits work
  const newImg = new Image();
  newImg.onload = () => {
    originalImage = newImg;
    fitCanvasToView();
  };
  newImg.src = canvas.toDataURL();

  pushHistory();
  showToast(`Rotated ${deg}°`);
}

function flipCanvas() {
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width;
  tmp.height = canvas.height;
  tmp.getContext('2d').drawImage(canvas, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(tmp, -canvas.width, 0);
  ctx.restore();

  const newImg = new Image();
  newImg.onload = () => { originalImage = newImg; };
  newImg.src = canvas.toDataURL();

  pushHistory();
  showToast('Flipped');
}

function cropCenter(factor) {
  const newW = Math.round(canvas.width * factor);
  const newH = Math.round(canvas.height * factor);
  const sx = Math.round((canvas.width - newW) / 2);
  const sy = Math.round((canvas.height - newH) / 2);

  const tmp = document.createElement('canvas');
  tmp.width = newW;
  tmp.height = newH;
  tmp.getContext('2d').drawImage(canvas, sx, sy, newW, newH, 0, 0, newW, newH);

  canvas.width = newW;
  canvas.height = newH;
  ctx.drawImage(tmp, 0, 0);

  const newImg = new Image();
  newImg.onload = () => { originalImage = newImg; fitCanvasToView(); };
  newImg.src = canvas.toDataURL();

  pushHistory();
  showToast('Cropped');
}

/* ---------- Text tool — tap to place ---------- */
canvas.addEventListener('pointerdown', (e) => {
  if (currentTool !== 'text') return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * canvas.width;
  const y = (e.clientY - rect.top) / rect.height * canvas.height;
  const dispX = e.clientX - textLayer.getBoundingClientRect().left;
  const dispY = e.clientY - textLayer.getBoundingClientRect().top;

  const item = createTextItem('Tap to edit', dispX, dispY, Math.max(20, canvas.width / 25));
  startEditText(item);
});

function createTextItem(text, x, y, fontSize) {
  const el = document.createElement('div');
  el.className = 'text-item';
  el.textContent = text;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.fontSize = fontSize * (canvas.getBoundingClientRect().width / canvas.width) + 'px';
  el.style.color = '#ffffff';
  el.style.fontFamily = 'system-ui';

  const item = { el, text, x, y, fontSize, color: '#ffffff' };

  let dragging = false, dragStart = null, moved = false;
  el.addEventListener('pointerdown', (e) => {
    if (el.classList.contains('editing')) return;
    dragging = true; moved = false;
    dragStart = { x: e.clientX, y: e.clientY, l: parseInt(el.style.left), t: parseInt(el.style.top) };
    el.setPointerCapture(e.pointerId);
    selectTextItem(item);
    e.stopPropagation();
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    el.style.left = (dragStart.l + dx) + 'px';
    el.style.top = (dragStart.t + dy) + 'px';
  });
  el.addEventListener('pointerup', () => {
    if (dragging) {
      dragging = false;
      if (!moved) startEditText(item);
    }
  });

  textLayer.appendChild(el);
  textItems.push(item);
  return item;
}

function selectTextItem(item) {
  textItems.forEach(t => t.el.classList.remove('selected'));
  item.el.classList.add('selected');
  selectedText = item;
}

function startEditText(item) {
  item.el.classList.add('editing');
  const current = item.text;
  item.el.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = current;
  item.el.appendChild(input);
  input.focus();
  input.select();
  function commit() {
    const v = input.value || 'Text';
    item.text = v;
    item.el.textContent = v;
    item.el.classList.remove('editing');
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
  });
}

/* ---------- Download ---------- */
document.getElementById('downloadBtn').addEventListener('click', () => {
  // Composite: canvas + text items rendered on top
  const out = document.createElement('canvas');
  out.width = canvas.width;
  out.height = canvas.height;
  const octx = out.getContext('2d');
  octx.drawImage(canvas, 0, 0);

  const textRect = textLayer.getBoundingClientRect();
  const canvasRect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / canvasRect.width;
  const scaleY = canvas.height / canvasRect.height;

  for (const t of textItems) {
    const elRect = t.el.getBoundingClientRect();
    const x = (elRect.left - textRect.left) * scaleX;
    const y = (elRect.top - textRect.top) * scaleY;
    const fontSize = parseFloat(t.el.style.fontSize) * scaleY;

    octx.font = `800 ${fontSize}px ${t.el.style.fontFamily || 'system-ui'}`;
    octx.fillStyle = t.el.style.color || '#fff';
    octx.textBaseline = 'top';
    octx.shadowColor = 'rgba(0,0,0,.5)';
    octx.shadowBlur = fontSize * 0.1;
    octx.fillText(t.text, x, y);
  }

  const url = out.toDataURL('image/jpeg', 0.92);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rendar-${Date.now()}.jpg`;
  a.click();
  showToast('Downloaded');
});

/* ---------- Mobile panel toggles ---------- */
document.getElementById('openToolsBtn').addEventListener('click', () => {
  document.getElementById('leftPanel').classList.toggle('open');
  document.getElementById('rightPanel').classList.remove('open');
});
document.getElementById('openAdjBtn').addEventListener('click', () => {
  document.getElementById('rightPanel').classList.toggle('open');
  document.getElementById('leftPanel').classList.remove('open');
});

loadImage();
updateSliderLabels();
